#-------------
#---Startup---
#-------------
exec_once=waybar
exec_once=./autostart.sh
exec_once=awww-daemon

#-------------
#----Input----
#-------------
# Teclado
numlock_on=1
# xkb_rules_layout=br
# xkb_rules_variant=thinkpad

#Trackpad
trackpad_natural_scrolling=1

#-------------
#----Binds----
#-------------
bind=Super,return,spawn,foot
bind=Super,space,spawn,rofi -config ~/.config/mango.back/rofi/config.rasi -show drun

bind=Super,r,reload_config
bind=Super,q,killclient,
bind=Super,n,switch_layout

bind=Super,h,focusdir,left
bind=Super,l,focusdir,right
bind=Super,k,focusdir,up
bind=Super,j,focusdir,down

bind=Super,Tab,togglejump
bind=ALT,Tab,overcircle,next

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

#-------------
#---Layouts---
#-------------
tag_rule=id:*,layout_name:scroller
circle_layout=scroller,tile

#-------------
#---Visuals---
#-------------
blur=1
blur_layer=1
blur_params_radius=3
blur_params_num_passes=2

shadows=1

root_color=0x161511ff
border_color=0x4a453dff
focus_color=0xd4a65dff
urgent_color=0xf49585ff
scratchpad_color=0x618ebcff
maximized_screen_color=0x739362ff
overlay_color=0x5294a1ff
global_color=0xb27b92ff
split_color=0x93b87fff
drop_color=0xd4a65d55

jump_label_decorate_fg_color=0xd9d4c7ff
jump_label_decorate_bg_color=0x161511ff
jump_label_decorate_focus_fg_color=0x161511ff
jump_label_decorate_focus_bg_color=0xd4a65dff
jump_label_decorate_border_color=0x4a453dff
jump_label_decorate_corner_radius=0

#---- Config por host ----
source-optional=~/.config/mango/host.conf
